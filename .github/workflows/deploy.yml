name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
        env:
          SITE_URL: https://rishavprasad.in

      # Uses the wrangler version pinned in package-lock.json, so CI runs the
      # exact binary that works locally instead of whatever the action bundles.
      - name: Verify Cloudflare credentials
        run: |
          set -o pipefail
          npx wrangler whoami 2>&1 | tee wrangler-whoami.log

      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log

      - name: Publish Cloudflare output on failure
        if: failure()
        run: |
          {
            echo '### Cloudflare output'
            echo '```'
            tail -n 30 wrangler-whoami.log 2>/dev/null
            tail -n 40 wrangler-deploy.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
